server.port=8080
spring.application.name=be_hotel

# ====== Static resources ======
spring.web.resources.static-locations=classpath:/static/
spring.mvc.favicon.enabled=true

# ====== Frontend base URL (build return/cancel URLs, etc.) ======
app.frontend.base-url=http://localhost:5173

# ====== Datasource (SQL Server) ======
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hotel_booking_system;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
# Dùng biến môi trường để linh hoạt giữa 123 (tung-request) và 123456 (dev):
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ====== JPA / Hibernate ======
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ====== PayOS ======
payos.client-id=3a9807ea-7145-4634-980b-f36d1e897376
payos.api-key=93a6eca8-3bfb-4759-a62c-b9c6d2763192
payos.checksum-key=92854ff89c015c86a6ed7cfe4ae1878f5387769c2cc2feab665ebd3baa8f02f4
# Logging level: DEBUG | INFO | NONE
payos.log-level=NONE

# ====== Logging ======
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ====== Multipart upload ======
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

